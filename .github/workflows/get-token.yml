name: Get Cline refreshToken

# Manual trigger only (Actions page → Run workflow)
on:
  workflow_dispatch:
    inputs:
      poll_timeout:
        description: "Authorization wait seconds (default 300, so you can take your time on a phone)"
        required: false
        default: "300"
        type: string
      use_warp:
        description: "Enable WARP network (bypasses registration risk control; disable and retry if it stops working)"
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: write

jobs:
  oauth:
    runs-on: ubuntu-latest
    steps:
      # Enforce Telegram variable check: do not run without them
      - name: Verify Telegram variables (skip run if unconfigured)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -u
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "❌ TG_BOT_TOKEN or TG_CHAT_ID is not configured; the workflow will not run."
            echo "   Configure these two secrets in repo Settings → Secrets and variables → Actions:"
            echo "     - TG_BOT_TOKEN: your Telegram Bot token"
            echo "     - TG_CHAT_ID  : the chat_id receiving messages"
            exit 1
          fi
          echo "✅ Telegram variables configured, continuing."

      - name: Check out code
        uses: actions/checkout@v4

      # =========================
      # 4️⃣ WARP network (changes the egress IP, bypasses registration risk control)
      # =========================
      - name: Enable WARP
        if: inputs.use_warp == 'true'
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      # =========================
      # 5️⃣ Check IP (confirm WARP is active)
      # =========================
      - name: Check IP
        if: inputs.use_warp == 'true'
        run: |
          echo "🌍 Current IP:"
          curl -s https://api.ipify.org
          echo ""
          curl -s https://ipinfo.io

      - name: Run OAuth script (authorization link and token pushed to Telegram)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OAUTH_POLL_TIMEOUT: ${{ inputs.poll_timeout }}
        run: python3 cline_oauth.py

      # Clean up old runs: keep only the latest run record
      - name: clear old run jobs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "deleted: $run_id"
              gh run delete $run_id || true
            fi
          done
